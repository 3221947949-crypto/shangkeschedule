# 川工专属版 Debug APK 云端构建（手动触发）。
# 依据本仓库自身约定：JDK 21（见 gradle/gradle-daemon-jvm.properties toolchainVersion=21）、
# CI 必须 -PuseMirror=false 关闭阿里云镜像（见 settings.gradle.kts 注释）。
name: Build SCIT Debug APK

on:
  workflow_dispatch:

# 允许构建完成后把 APK 发布到本仓库的「发行版（Releases）」，供直接下载
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run SCIT adapter tests (real xskbcx sample)
        run: node --test scripts/tests/scit_qiangzhi.test.cjs

      - name: Regenerate school index (SCIT -> dedicated adapter)
        run: |
          pip install pypinyin protobuf
          python tools/build_schools.py
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'tools')
          import school_index_pb2
          idx = school_index_pb2.SchoolIndex()
          idx.ParseFromString(open('shared/assets/offline_repo/index/school_index.pb','rb').read())
          hit = [s for s in idx.schools if s.id == 'u_e28701bb']
          assert hit, 'SCIT entry missing from generated index'
          s = hit[0]
          print('SCIT resource_folder =', s.resource_folder)
          for a in s.adapters:
              print('SCIT adapter:', a.adapter_id, a.asset_js_path, a.import_url[:60])
          assert s.resource_folder == 'SCIT', 'SCIT dedicated folder not matched'
          assert any(a.asset_js_path == 'scit.js' for a in s.adapters), 'SCIT adapter js is not scit.js'
          print('SCIT_ADAPTER_OK')
          EOF

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug -PuseMirror=false --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: scit-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "scit-debug-${{ github.run_number }}" androidApp/build/outputs/apk/debug/*.apk \
            --title "川工专属版 Debug #${{ github.run_number }}" \
            --notes "自动构建的 Debug APK：强智解析已按真实课表样本定版（川工专属脚本）。下载后直接安装。注意：Debug 签名与官方 Release 版不能互相覆盖升级，换版前先在 App 内导出备份再卸载。"
